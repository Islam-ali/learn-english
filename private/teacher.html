<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Homework Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#F1F4F7;--sheet:#FFFFFF;--ink:#13283E;--ink-2:#536579;--line:#D5DDE4;--line-2:#E7ECF1;
  --rx:#2443C0;--rx-soft:#E8EDFC;--on-rx:#FFFFFF;--mark:#A23A16;--mark-soft:#FBE8DF;
  --ok:#137A55;--ok-soft:#DFF2E8;--bad:#B4470E;--bad-soft:#FBEADD;--mint:#E2F1EA;--mint-ink:#1B5A48;
  --shade:rgba(19,40,62,.16);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1520;--sheet:#142131;--ink:#E5ECF3;--ink-2:#9FB1C3;--line:#28394B;--line-2:#1E2D3D;
  --rx:#93A9FF;--rx-soft:#1C2950;--on-rx:#0D1520;--mark:#F4A27A;--mark-soft:#3A2016;
  --ok:#53CC97;--ok-soft:#113426;--bad:#F2A064;--bad-soft:#3A2516;--mint:#133229;--mint-ink:#9FE0C6;--shade:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1520;--sheet:#142131;--ink:#E5ECF3;--ink-2:#9FB1C3;--line:#28394B;--line-2:#1E2D3D;
  --rx:#93A9FF;--rx-soft:#1C2950;--on-rx:#0D1520;--mark:#F4A27A;--mark-soft:#3A2016;
  --ok:#53CC97;--ok-soft:#113426;--bad:#F2A064;--bad-soft:#3A2516;--mint:#133229;--mint-ink:#9FE0C6;--shade:rgba(0,0,0,.45);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rx);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.hint{font-size:14.5px;color:var(--ink-2)}
.shell{max-width:1240px;margin:0 auto;padding:18px clamp(16px,4vw,40px) 72px;padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
.appbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.appbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer;line-height:1.2;color:var(--ink)}
.btn:hover{border-color:var(--rx)}
.btn.primary{background:var(--rx);border-color:var(--rx);color:var(--on-rx);font-weight:700}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn[disabled]{opacity:.55;cursor:default}
.hero h1{font-size:clamp(40px,6vw,64px);font-weight:800;letter-spacing:-.03em;margin:6px 0 8px}
.hero .lead{color:var(--ink-2);max-width:56ch;font-size:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 22px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;min-width:120px}
.stat b{font-family:var(--f-display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--ink-2)}
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:15px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--mark)}
.list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 140px);overflow:auto;padding:2px}
.it{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.it:hover{border-color:var(--rx)}
.it[aria-current="true"]{border-color:var(--rx);box-shadow:inset 3px 0 0 var(--rx)}
.it b{font-size:16px}
.it .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.submitted{border-color:var(--mark);background:var(--mark-soft);color:var(--mark)}
.chip.reviewed{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--ink-2);background:var(--sheet)}
.detail{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,32px);min-width:0}
.d-head{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.d-head h2{font-size:clamp(28px,3.6vw,38px);font-weight:700}
.d-meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink-2);font-size:15px}
.d-meta b{color:var(--ink)}
.sec{margin-top:26px}
.sec h3{font-size:21px;font-weight:600;margin-bottom:6px}
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--line-2)}
.q .n{font-family:var(--f-mono);font-size:13px;color:var(--mark);padding-top:3px}
.q .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.q .p{color:var(--ink-2);font-size:15.5px}
.ans{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:17.5px;overflow-wrap:anywhere}
.ans .mk{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:3px}
.mk.ok{background:var(--ok-soft);color:var(--ok)}.mk.no{background:var(--bad-soft);color:var(--bad)}.mk.open{background:var(--rx-soft);color:var(--rx)}.mk.none{background:var(--line-2);color:var(--ink-2)}
.ans.blank{color:var(--ink-2);font-weight:400;font-style:italic}
.exp{font-size:14.5px;color:var(--ink-2)}
.exp b{color:var(--ok);font-weight:700}
.cm{display:flex;flex-direction:column;gap:6px}
.cm textarea,.note textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:16px;line-height:1.45;resize:vertical;min-height:42px}
.cm textarea:focus,.note textarea:focus{outline:none;border-color:var(--rx);box-shadow:0 0 0 3px var(--rx-soft)}
.cm textarea.has{border-color:var(--mint-ink);background:var(--mint)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.quick button:hover{border-color:var(--rx);color:var(--rx)}
.addc{align-self:flex-start;font-size:14px;padding:4px 10px}
.note{margin-top:28px;padding-top:20px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.note h3{font-size:21px}
.bar{position:sticky;bottom:0;margin:20px calc(-1 * clamp(18px,3vw,32px)) calc(-1 * clamp(18px,3vw,32px));padding:14px clamp(18px,3vw,32px);background:var(--sheet);border-top:1px solid var(--line);border-radius:0 0 14px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.bar .sp{display:none}
.bar .status{flex:1 1 220px}
.status{font-size:14.5px;color:var(--ink-2)}
.status.err{color:var(--bad)}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.filter label{display:flex;gap:6px;align-items:center;font-size:14.5px;color:var(--ink-2);cursor:pointer}
.backlist{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .list{max-height:none}
  .layout.open .side{display:none}
  .layout:not(.open) .detail{display:none}
  .backlist{display:inline-flex;margin-bottom:12px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="appbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">EN</span>Homework Review</div>
    <span class="sp"></span>
    <button type="button" class="btn quiet" id="reload">Refresh</button>
  </header>

  <section class="hero">
    <span class="mono" style="color:var(--mark)">Teacher</span>
    <h1>Homework review</h1>
    <p class="lead">Islam's workbook pages and assignments. Read each answer, add a comment where it helps, and mark the homework as reviewed. He sees your comments on his homework screen.</p>
  </section>
  <div class="stats" id="stats"></div>

  <div class="layout" id="layout">
    <aside class="side">
      <div class="tabs" role="tablist" aria-label="Filter homework">
        <button type="button" role="tab" data-f="todo" aria-selected="true">To review</button>
        <button type="button" role="tab" data-f="done" aria-selected="false">Reviewed</button>
        <button type="button" role="tab" data-f="all" aria-selected="false">All</button>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
    </aside>
    <main class="detail" id="detail">
      <div class="empty">Choose a homework on the left to review it.</div>
    </main>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=iso=>{if(!iso)return '';try{return new Date(iso).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}};
const QUICK=['Well done!','Good, but check the spelling.','Check the word order.','Use the past simple here.','Write a complete sentence.','Look at this again in class.'];
const st={list:[],filter:'todo',cur:null,sub:null,dirty:false,saving:false,err:''};

async function api(url,opts){
  const r=await fetch(url,Object.assign({credentials:'same-origin',cache:'no-store'},opts||{}));
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||('Error '+r.status));
  return d;
}
async function loadList(){
  try{const d=await api('/api/review');st.list=d.list||[];st.err='';}
  catch(e){st.err=e.message;}
  renderList();renderStats();
}
function renderStats(){
  const todo=st.list.filter(x=>x.status!=='reviewed').length,done=st.list.length-todo;
  const ans=st.list.reduce((n,x)=>n+((x.stats&&x.stats.a)||0),0);
  $('#stats').innerHTML=`<div class="stat"><b>${todo}</b><span>to review</span></div><div class="stat"><b>${done}</b><span>reviewed</span></div><div class="stat"><b>${ans}</b><span>answers sent</span></div>`;
}
function renderList(){
  const L=st.list.filter(x=>st.filter==='all'||(st.filter==='todo'?x.status!=='reviewed':x.status==='reviewed'));
  document.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-selected',b.dataset.f===st.filter));
  if(st.err){$('#list').innerHTML=`<div class="empty">${esc(st.err)}</div>`;return;}
  if(!L.length){$('#list').innerHTML=`<div class="empty">${st.filter==='todo'?'Nothing to review right now.':st.filter==='done'?'No reviewed homework yet.':'No homework has been sent yet.'}</div>`;return;}
  $('#list').innerHTML=L.map(x=>{const s=x.stats||{};return `<button type="button" class="it" data-u="${esc(x.unit)}" aria-current="${x.unit===st.cur}">
    <span class="row"><span class="mono" style="color:var(--mark)">${esc(x.kind||'Homework')}</span><span class="chip ${esc(x.status)}">${x.status==='reviewed'?'Reviewed':x.reviewedAt?'Sent again':'New'}</span></span>
    <b>${esc(x.title)}</b>
    <span class="hint">${s.a||0} / ${s.n||0} answered${s.sc?` · ${s.ok} / ${s.sc} correct`:''}</span>
    <span class="hint">Sent ${esc(when(x.submittedAt))}${x.sends>1?` · ${x.sends} times`:''}</span></button>`;}).join('');
}
async function open(unit){
  if(st.dirty&&st.cur!==unit&&!confirmLeave())return;
  st.cur=unit;st.sub=null;st.dirty=false;renderList();
  $('#layout').classList.add('open');
  $('#detail').innerHTML='<p class="hint">Loading…</p>';
  try{const d=await api('/api/review?unit='+encodeURIComponent(unit));st.sub=d.sub;renderDetail();}
  catch(e){$('#detail').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}
  window.scrollTo({top:$('#layout').offsetTop-12,behavior:'smooth'});
}
function confirmLeave(){
  // No browser dialogs: show an inline warning instead and keep the reviewer on the page.
  setStatus('You have unsaved comments. Save them first, or press Discard.',true);
  $('#discard').hidden=false;return false;
}
function renderDetail(){
  const s=st.sub;if(!s)return;
  const C=s.comments||{},stats=s.stats||{};
  let h=`<button type="button" class="btn backlist" id="back">← All homework</button>
  <div class="d-head"><span class="mono" style="color:var(--mark)">${esc(s.kind||'Homework')} · ${esc(s.lesson||'')}</span><h2>${esc(s.title)}</h2>
  <div class="d-meta"><span><b>${stats.a||0}</b> / ${stats.n||0} answered</span>${stats.sc?`<span><b>${stats.ok}</b> / ${stats.sc} correct (auto-checked)</span>`:''}<span>Sent ${esc(when(s.submittedAt))}${s.sends>1?` · sent ${s.sends} times`:''}</span>${s.reviewedAt?`<span>Reviewed ${esc(when(s.reviewedAt))}</span>`:''}</div>
  <p class="hint">Green and orange marks are the page's automatic check against the answer key. Open questions have no key; the model answer is only a guide.</p></div>`;
  (s.report||[]).forEach((sec,si)=>{
    h+=`<section class="sec"><h3>${esc(sec.title)}</h3>`;
    (sec.items||[]).forEach((it,ii)=>{
      const k=si+'-'+ii,c=C[k]||'',has=!!String(c).trim();
      const mk=!it.a?'<span class="mk none">No answer</span>':it.open?'<span class="mk open">Open</span>':it.ok?'<span class="mk ok">✓ Correct</span>':'<span class="mk no">✗ Check</span>';
      h+=`<div class="q"><span class="n">${esc(it.n)}</span><div class="body">
        <p class="p">${esc(it.p)}</p>
        <p class="ans${it.a?'':' blank'}">${mk}<span>${it.a?esc(it.a):'—'}</span></p>
        ${it.x&&(it.open||it.ok===false)?`<p class="exp">${it.open?'Model answer':'Answer key'}: <b>${esc(it.x)}</b></p>`:''}
        <div class="cm"${has?'':' hidden'} id="cm-${k}"><label class="hint" for="ta-${k}">Your comment</label><textarea id="ta-${k}" data-k="${k}" rows="2" class="${has?'has':''}" placeholder="Write a comment for this answer…">${esc(c)}</textarea>
          <div class="quick">${QUICK.map(q=>`<button type="button" data-q="${k}">${esc(q)}</button>`).join('')}</div></div>
        ${has?'':`<button type="button" class="btn quiet addc" data-add="${k}">+ Comment</button>`}
      </div></div>`;
    });
    h+=`</section>`;
  });
  h+=`<div class="note"><h3>Overall feedback</h3><p class="hint">What did he do well? What should he practise next?</p><label class="hint" for="note" style="position:absolute;left:-9999px">Overall feedback</label><textarea id="note" rows="4" placeholder="Great work on… Next time, practise…">${esc(s.note||'')}</textarea></div>
  <div class="bar"><span class="status" id="status">${s.status==='reviewed'?'Reviewed. Edit and save again any time.':'Not reviewed yet.'}</span><button type="button" class="btn quiet" id="discard" hidden>Discard changes</button><span class="sp"></span><button type="button" class="btn" id="save">Save comments</button><button type="button" class="btn primary" id="done">${s.status==='reviewed'?'Save &amp; keep reviewed':'Save &amp; mark reviewed'}</button></div>`;
  $('#detail').innerHTML=h;
}
function collect(){
  const comments={};document.querySelectorAll('#detail textarea[data-k]').forEach(t=>{if(t.value.trim())comments[t.dataset.k]=t.value.trim();});
  return {unit:st.cur,comments,note:($('#note')||{}).value||''};
}
function setStatus(t,err){const el=$('#status');if(el){el.textContent=t;el.classList.toggle('err',!!err);}}
async function save(reviewed){
  if(st.saving||!st.sub)return;st.saving=true;
  const body=collect();body.reviewed=!!reviewed;
  setStatus('Saving…');
  try{const d=await api('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    st.sub=d.sub;st.dirty=false;
    const i=st.list.findIndex(x=>x.unit===st.cur);if(i>=0){st.list[i].status=d.sub.status;st.list[i].reviewedAt=d.sub.reviewedAt;}
    renderDetail();renderList();renderStats();setStatus(reviewed?'Saved and marked as reviewed. Islam can see your comments now.':'Comments saved.');}
  catch(e){setStatus('Not saved: '+e.message,true);}
  st.saving=false;
}
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){st.filter=f.dataset.f;renderList();return;}
  const it=e.target.closest('[data-u]');if(it){open(it.dataset.u);return;}
  const a=e.target.closest('[data-add]');if(a){const k=a.dataset.add;$('#cm-'+k).hidden=false;a.remove();$('#ta-'+k).focus();return;}
  const q=e.target.closest('[data-q]');if(q){const t=$('#ta-'+q.dataset.q);t.value=(t.value.trim()?t.value.trim()+' ':'')+q.textContent;t.classList.add('has');st.dirty=true;t.focus();return;}
  if(e.target.closest('#save')){save(false);return;}
  if(e.target.closest('#done')){save(true);return;}
  if(e.target.closest('#discard')){st.dirty=false;renderDetail();return;}
  if(e.target.closest('#back')){if(st.dirty){confirmLeave();return;}$('#layout').classList.remove('open');st.cur=null;renderList();return;}
  if(e.target.closest('#reload')){loadList();if(st.cur&&!st.dirty)open(st.cur);}
});
document.addEventListener('input',e=>{if(e.target.matches('#detail textarea')){st.dirty=true;if(e.target.dataset.k)e.target.classList.toggle('has',!!e.target.value.trim());}});
window.addEventListener('beforeunload',e=>{if(st.dirty){e.preventDefault();e.returnValue='';}});
loadList();
})();
</script>
</body>
</html>
